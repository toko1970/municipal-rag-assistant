# Disposable test services only. Never combine this with the application compose.yaml.
# Use an explicit --project-name and --env-file /dev/null; remove only that project.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: rag_handoff_test
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: rag_test_only
    ports:
      - "127.0.0.1:${RAG_TEST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_handoff_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${RAG_TEST_QDRANT_PORT:-16333}:6333"
      - "127.0.0.1:${RAG_TEST_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant_test_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_test_data:
  qdrant_test_data:
