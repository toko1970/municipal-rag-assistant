name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-eval.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check config.py src scripts tests
      - name: Test without external APIs
        run: python -m pytest -q -m "not integration" tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test, typecheck, lint, and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build -t municipal-rag-ui-smoke .
      - name: Verify evaluation data is excluded
        run: >-
          docker run --rm --entrypoint python municipal-rag-ui-smoke
          -c "from pathlib import Path; assert not Path('/app/eval').exists()"
      - name: Start API and static UI
        run: |
          docker run --detach --name municipal-rag-ui-smoke \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env SESSION_SIGNING_KEYS_JSON='{"ci":"01234567890123456789012345678901"}' \
            --env SESSION_CURRENT_KEY_ID=ci \
            --env CANONICAL_ORIGIN=http://localhost:8080 \
            municipal-rag-ui-smoke
      - name: Smoke-test UI and health routes
        id: smoke
        run: |
          live_ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/health/live -o /tmp/live.json; then
              live_ready=true
              break
            fi
            sleep 1
          done
          if [ "$live_ready" != true ]; then
            echo "API did not become live within 30 seconds"
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/live.json
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/ -o /tmp/ui.html
          grep -q 'id="root"' /tmp/ui.html
          curl --fail http://localhost:8080/api/health/live
          status=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://localhost:8080/api/health/ready)
          test "$status" = "200" -o "$status" = "503"
          if [ "$status" = "200" ]; then
            grep -q '"status":"ok"' /tmp/ready.json
          else
            grep -q '"error":' /tmp/ready.json
          fi
      - name: Show container state and logs on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          docker ps -a --no-trunc
          docker inspect --format='State={{json .State}} RestartCount={{.RestartCount}}' municipal-rag-ui-smoke || true
          docker logs --timestamps municipal-rag-ui-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force municipal-rag-ui-smoke 2>/dev/null || true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: rag_portfolio_test
          POSTGRES_USER: rag_app_test
          POSTGRES_PASSWORD: rag_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_app_test -d rag_portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag_app_test:rag_test_only@localhost:5432/rag_portfolio_test
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION_NAME: ci_integration_${{ github.run_id }}_${{ github.run_attempt }}
      VISUAL_ASSET_BACKEND: local
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      MISTRAL_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-eval.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize disposable PostgreSQL schema
        run: python -m scripts.manage_rag_v2 migrate
      - name: Run PostgreSQL and Qdrant integration tests
        run: python -m pytest -q -m integration tests/integration

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without cloud state
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate -no-color

  build-candidate-image:
    needs: [test-and-lint, integration, terraform-check, container-smoke]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CD == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      IMAGE_TAG: asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Build and publish candidate image without deploying
        id: publish
        run: |
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          test -n "$digest"
          image="asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Candidate image (no deployment): %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Preparation only. Public traffic is changed by promote.yml after review.
    needs: [build-candidate-image]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CD == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build-candidate-image.outputs.image }}
      REVISION: municipal-rag-assistant-r${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: review-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      GCS_VISUAL_ASSET_BUCKET: ${{ vars.GCS_VISUAL_ASSET_BUCKET }}
      CANONICAL_ORIGIN: ${{ vars.CANONICAL_ORIGIN }}
      SESSION_CURRENT_KEY_ID: ${{ vars.SESSION_CURRENT_KEY_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate configuration and snapshot existing public traffic
        run: |
          set -euo pipefail
          test -n "$CLOUD_SQL_CONNECTION_NAME"
          test -n "$QDRANT_URL"
          test -n "$GCS_VISUAL_ASSET_BUCKET"
          test -n "$CANONICAL_ORIGIN"
          test -n "$SESSION_CURRENT_KEY_ID"
          mkdir release-evidence
          gcloud run services describe municipal-rag-assistant --project=municipal-rag-portfolio --region=asia-northeast1 --format=json > "$RUNNER_TEMP/service-before.json"
      - name: Derive exact service and candidate origins
        id: candidate-origin
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          service = json.loads(Path(os.environ["RUNNER_TEMP"], "service-before.json").read_text())
          service_url = service["status"]["url"]
          parsed = urlsplit(service_url)
          service_origin = urlunsplit((parsed.scheme, parsed.netloc, "", "", ""))
          if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".run.app") or parsed.port:
              raise SystemExit("Cloud Run service URL is not the expected HTTPS run.app origin")
          if service_origin != os.environ["CANONICAL_ORIGIN"]:
              raise SystemExit("CANONICAL_ORIGIN does not match the existing Cloud Run service URL")
          candidate_origin = f"https://{os.environ['RELEASE_TAG']}---{parsed.hostname}"
          origins = json.dumps([service_origin, candidate_origin], separators=(",", ":"))
          origins_env = origins.replace(",", "\\,")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"canonical_origins_json={origins}\n")
              output.write(f"canonical_origins_env={origins_env}\n")
          PY
      - name: Apply pending database schema migrations
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          job: municipal-rag-bootstrap
          image: ${{ env.IMAGE }}
          wait: false
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            ANSWER_GENERATION_FLOW=autoresearch_candidate
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.8-flash
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
            VISUAL_ASSET_BACKEND=gcs
            GCS_VISUAL_ASSET_BUCKET=${{ env.GCS_VISUAL_ASSET_BUCKET }}
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:1
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
          flags: >-
            --service-account=municipal-rag-runtime@municipal-rag-portfolio.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
            --command=python
            --args=^,^-m,scripts.manage_rag_v2,migrate
            --cpu=1
            --memory=1Gi
            --max-retries=0
            --task-timeout=15m
      - name: Execute database schema migrations
        run: >-
          gcloud run jobs execute municipal-rag-bootstrap
          --project=municipal-rag-portfolio
          --region=asia-northeast1
          --wait
      - name: Create the exact candidate revision without public traffic
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          service: municipal-rag-assistant
          image: ${{ env.IMAGE }}
          suffix: r${{ github.run_id }}-${{ github.run_attempt }}
          tag: ${{ env.RELEASE_TAG }}
          no_traffic: true
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            ANSWER_GENERATION_FLOW=autoresearch_candidate
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.8-flash
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
            VISUAL_ASSET_BACKEND=gcs
            GCS_VISUAL_ASSET_BUCKET=${{ env.GCS_VISUAL_ASSET_BUCKET }}
            CANONICAL_ORIGIN=${{ env.CANONICAL_ORIGIN }}
            CANONICAL_ORIGINS_JSON=${{ steps.candidate-origin.outputs.canonical_origins_env }}
            SESSION_CURRENT_KEY_ID=${{ env.SESSION_CURRENT_KEY_ID }}
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:1
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
            SESSION_SIGNING_KEYS_JSON=rag-session-signing-keys:latest
          flags: >-
            --service-account=municipal-rag-runtime@municipal-rag-portfolio.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
      - name: Configure the existing job for smoke only
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          job: municipal-rag-bootstrap
          image: ${{ env.IMAGE }}
          wait: false
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            ANSWER_GENERATION_FLOW=autoresearch_candidate
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.8-flash
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
            VISUAL_ASSET_BACKEND=gcs
            GCS_VISUAL_ASSET_BUCKET=${{ env.GCS_VISUAL_ASSET_BUCKET }}
            CANONICAL_ORIGIN=${{ env.CANONICAL_ORIGIN }}
            CANONICAL_ORIGINS_JSON=${{ steps.candidate-origin.outputs.canonical_origins_env }}
            SESSION_CURRENT_KEY_ID=${{ env.SESSION_CURRENT_KEY_ID }}
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:1
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
            SESSION_SIGNING_KEYS_JSON=rag-session-signing-keys:latest
          # The action separates flag=value into argv entries. A list prefix
          # keeps leading -m from being mistaken for another gcloud option.
          # Keep option=value together: gcloud rejects duplicate list items.
          flags: >-
            --service-account=municipal-rag-runtime@municipal-rag-portfolio.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
            --command=python
            --args=^,^-m,scripts.manage_rag_v2,smoke,--max-cases=5,--max-attempts=7,--max-503-retries=2
            --cpu=1
            --memory=1Gi
            --tasks=1
            --parallelism=1
            --max-retries=0
            --task-timeout=15m
      - name: Snapshot the pinned image manifest for offline verification
        env:
          PINNED_IMAGE: ${{ env.IMAGE }}
        run: >-
          python -m scripts.fetch_artifact_manifest
          --image "$PINNED_IMAGE"
          --output "$RUNNER_TEMP/image-manifest.json"
      - name: Match the candidate and smoke runtime before any question
        env:
          PINNED_IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "$REVISION" --project=municipal-rag-portfolio --region=asia-northeast1 --format=json > "$RUNNER_TEMP/revision.json"
          gcloud run jobs describe municipal-rag-bootstrap --project=municipal-rag-portfolio --region=asia-northeast1 --format=json > "$RUNNER_TEMP/job.json"
          python -m scripts.release_gate check-runtime --revision "$RUNNER_TEMP/revision.json" --job "$RUNNER_TEMP/job.json" --expected-image "$PINNED_IMAGE" --image-index-manifest "$RUNNER_TEMP/image-manifest.json"
      - name: Execute five bounded smoke cases without migration or ingestion
        run: |
          set -euo pipefail
          gcloud run jobs execute municipal-rag-bootstrap --project=municipal-rag-portfolio --region=asia-northeast1 --wait --format=json > "$RUNNER_TEMP/execution.json"
      - name: Preserve tested identity, rollback target, and pending review
        env:
          PINNED_IMAGE: ${{ env.IMAGE }}
          CANONICAL_ORIGINS_JSON: ${{ steps.candidate-origin.outputs.canonical_origins_json }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/image-manifest.json" release-evidence/image-index.json
          gcloud run services describe municipal-rag-assistant --project=municipal-rag-portfolio --region=asia-northeast1 --format=json > "$RUNNER_TEMP/service-after.json"
          python -m scripts.release_gate prepare --before-service "$RUNNER_TEMP/service-before.json" --service "$RUNNER_TEMP/service-after.json" --revision "$RUNNER_TEMP/revision.json" --execution "$RUNNER_TEMP/execution.json" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --expected-revision "$REVISION" --image "$PINNED_IMAGE" --image-index-manifest release-evidence/image-index.json --output release-evidence/candidate.json
          python -m scripts.release_gate review-template --manifest release-evidence/candidate.json --image-index-manifest release-evidence/image-index.json --output release-evidence/review-template.json
          python -c 'import json, os; candidate=json.load(open("release-evidence/candidate.json")); origins=json.loads(os.environ["CANONICAL_ORIGINS_JSON"]); assert candidate["tagged_url"] in origins'
          tagged_url=$(python -c 'import json; print(json.load(open("release-evidence/candidate.json"))["tagged_url"])')
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 "$tagged_url/" -o /tmp/candidate-ui.html
          grep -q 'id="root"' /tmp/candidate-ui.html
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 "$tagged_url/api/health/live"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 "$tagged_url/api/health/ready"
          printf '## Candidate prepared; public traffic unchanged\n\nRevision: `%s`\n\nUI review URL: %s\n\nAll five semantic/UI checks remain PENDING. Use the Promote reviewed revision workflow only after completing review-template.json.\n' "$REVISION" "$tagged_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
