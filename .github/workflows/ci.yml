name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      ANSWER_GENERATION_FLOW: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-eval.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check config.py src scripts tests
      - name: Test without external APIs
        run: python -m pytest -q -m "not integration" tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test, typecheck, lint, and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build -t municipal-rag-ui-smoke .
      - name: Verify evaluation data is excluded
        run: >-
          docker run --rm --entrypoint python municipal-rag-ui-smoke
          -c "from pathlib import Path; assert not Path('/app/eval').exists()"
      - name: Start API and static UI
        run: |
          docker run --detach --name municipal-rag-ui-smoke \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env SESSION_SIGNING_KEYS_JSON='{"ci":"01234567890123456789012345678901"}' \
            --env SESSION_CURRENT_KEY_ID=ci \
            --env CANONICAL_ORIGIN=http://localhost:8080 \
            municipal-rag-ui-smoke
      - name: Smoke-test UI and health routes
        id: smoke
        run: |
          live_ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/health/live -o /tmp/live.json; then
              live_ready=true
              break
            fi
            sleep 1
          done
          if [ "$live_ready" != true ]; then
            echo "API did not become live within 30 seconds"
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/live.json
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/ -o /tmp/ui.html
          grep -q 'id="root"' /tmp/ui.html
          curl --fail http://localhost:8080/api/health/live
          status=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://localhost:8080/api/health/ready)
          test "$status" = "200" -o "$status" = "503"
          if [ "$status" = "200" ]; then
            grep -q '"status":"ok"' /tmp/ready.json
          else
            grep -q '"error":' /tmp/ready.json
          fi
      - name: Show container state and logs on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          docker ps -a --no-trunc
          docker inspect --format='State={{json .State}} RestartCount={{.RestartCount}}' municipal-rag-ui-smoke || true
          docker logs --timestamps municipal-rag-ui-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force municipal-rag-ui-smoke 2>/dev/null || true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: rag_portfolio_test
          POSTGRES_USER: rag_app_test
          POSTGRES_PASSWORD: rag_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_app_test -d rag_portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag_app_test:rag_test_only@localhost:5432/rag_portfolio_test
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION_NAME: ci_integration_${{ github.run_id }}_${{ github.run_attempt }}
      VISUAL_ASSET_BACKEND: local
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      ANSWER_GENERATION_FLOW: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-eval.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize disposable PostgreSQL schema
        run: python -m scripts.manage_rag_v2 migrate
      - name: Run PostgreSQL and Qdrant integration tests
        run: python -m pytest -q -m integration tests/integration

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without cloud state
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate -no-color

  build-candidate-image:
    needs: [test-and-lint, integration, terraform-check, container-smoke]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CD == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      IMAGE_TAG: asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Build and publish candidate image without deploying
        id: publish
        run: |
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          test -n "$digest"
          image="asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Candidate image (no deployment): `$image`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build-candidate-image]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CD == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build-candidate-image.outputs.image }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      GCS_VISUAL_ASSET_BUCKET: ${{ vars.GCS_VISUAL_ASSET_BUCKET }}
      CANONICAL_ORIGIN: ${{ vars.CANONICAL_ORIGIN }}
      SESSION_CURRENT_KEY_ID: ${{ vars.SESSION_CURRENT_KEY_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare isolated candidate tag and origin
        id: candidate
        env:
          CANONICAL_ORIGIN: ${{ env.CANONICAL_ORIGIN }}
        run: |
          candidate_tag="review-${GITHUB_SHA:0:12}"
          candidate_suffix="r-${GITHUB_SHA:0:12}"
          case "$CANONICAL_ORIGIN" in
            https://*) canonical_host="${CANONICAL_ORIGIN#https://}" ;;
            *) echo "CANONICAL_ORIGIN must use HTTPS" >&2; exit 1 ;;
          esac
          if [[ "$canonical_host" == */* || -z "$canonical_host" ]]; then
            echo "CANONICAL_ORIGIN must be an origin without a path" >&2
            exit 1
          fi
          candidate_origin="https://${candidate_tag}---${canonical_host}"
          origins_json="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:], separators=(",", ":")))' "$CANONICAL_ORIGIN" "$candidate_origin")"
          origins_json_escaped="${origins_json//,/\\,}"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$candidate_suffix" >> "$GITHUB_OUTPUT"
          echo "url=$candidate_origin" >> "$GITHUB_OUTPUT"
          echo "origins_json=$origins_json_escaped" >> "$GITHUB_OUTPUT"
      - name: Validate RAG v2 deployment configuration
        run: |
          test -n "$CLOUD_SQL_CONNECTION_NAME"
          test -n "$QDRANT_URL"
          test -n "$GCS_VISUAL_ASSET_BUCKET"
          test -n "$CANONICAL_ORIGIN"
          test -n "$SESSION_CURRENT_KEY_ID"
      - name: Initialize and smoke-test RAG v2 dependencies
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          job: municipal-rag-bootstrap
          image: ${{ env.IMAGE }}
          wait: true
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            ANSWER_GENERATION_FLOW=autoresearch_candidate
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.8-flash
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
            VISUAL_ASSET_BACKEND=gcs
            GCS_VISUAL_ASSET_BUCKET=${{ env.GCS_VISUAL_ASSET_BUCKET }}
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:2
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
          flags: >-
            --service-account=municipal-rag-runtime@municipal-rag-portfolio.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
            --command=python
            --args=cloud_bootstrap.py
            --cpu=1
            --memory=1Gi
            --max-retries=0
            --task-timeout=15m
      - name: Deploy a new revision of the existing service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          service: municipal-rag-assistant
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            ANSWER_GENERATION_FLOW=autoresearch_candidate
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.8-flash
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
            VISUAL_ASSET_BACKEND=gcs
            GCS_VISUAL_ASSET_BUCKET=${{ env.GCS_VISUAL_ASSET_BUCKET }}
            CANONICAL_ORIGIN=${{ env.CANONICAL_ORIGIN }}
            CANONICAL_ORIGINS_JSON=${{ steps.candidate.outputs.origins_json }}
            SESSION_CURRENT_KEY_ID=${{ env.SESSION_CURRENT_KEY_ID }}
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:2
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
            SESSION_SIGNING_KEYS_JSON=rag-session-signing-keys:latest
          flags: >-
            --add-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
            --max=2
            --concurrency=5
            --startup-probe=httpGet.path=/api/health/live,httpGet.port=8080,timeoutSeconds=3,periodSeconds=10,failureThreshold=12
            --readiness-probe=httpGet.path=/api/health/ready,httpGet.port=8080,timeoutSeconds=3,periodSeconds=10,failureThreshold=3,successThreshold=1
            --liveness-probe=httpGet.path=/api/health/live,httpGet.port=8080,timeoutSeconds=3,periodSeconds=10,failureThreshold=3
          suffix: ${{ steps.candidate.outputs.suffix }}
          tag: ${{ steps.candidate.outputs.tag }}
          no_traffic: true
      - name: Resolve candidate tag URL
        id: candidate-url
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          candidate_url="$(gcloud run services describe municipal-rag-assistant \
            --project=municipal-rag-portfolio \
            --region=asia-northeast1 \
            --format=json | jq -er --arg tag "$CANDIDATE_TAG" \
              '.status.traffic[] | select(.tag == $tag) | .url')"
          test -n "$candidate_url"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"
      - name: Check React UI and API health endpoints
        run: |
          curl --fail --retry 5 --retry-delay 10 "${{ steps.candidate-url.outputs.url }}/" -o /tmp/deployed-ui.html
          grep -q 'id="root"' /tmp/deployed-ui.html
          curl --fail --retry 5 --retry-delay 10 "${{ steps.candidate-url.outputs.url }}/api/health/live"
          curl --fail --retry 5 --retry-delay 10 "${{ steps.candidate-url.outputs.url }}/api/health/ready"
