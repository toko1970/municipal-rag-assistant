name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test without external APIs
        run: python -m pytest -q tests

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without cloud state
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate -no-color

  deploy:
    needs: [test-and-lint, terraform-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Build and push the commit image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy a new revision of the existing service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          service: municipal-rag-assistant
          image: ${{ env.IMAGE }}
      - name: Check Streamlit health endpoint
        run: curl --fail --retry 5 --retry-delay 10 "${{ steps.deploy.outputs.url }}/_stcore/health"
