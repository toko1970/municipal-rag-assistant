name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test without external APIs
        run: python -m pytest -q -m "not integration" tests

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without cloud state
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate -no-color

  deploy:
    needs: [test-and-lint, terraform-check]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CD == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/municipal-rag-portfolio/municipal-rag-images/municipal-rag-assistant:${{ github.sha }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      QDRANT_URL: ${{ vars.QDRANT_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: municipal-rag-portfolio
          workload_identity_provider: projects/280649014820/locations/global/workloadIdentityPools/github-actions/providers/municipal-rag
          service_account: municipal-rag-deployer@municipal-rag-portfolio.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Build and push the commit image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Validate RAG v2 deployment configuration
        run: |
          test -n "$CLOUD_SQL_CONNECTION_NAME"
          test -n "$QDRANT_URL"
      - name: Initialize and smoke-test RAG v2 dependencies
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          job: municipal-rag-bootstrap
          image: ${{ env.IMAGE }}
          wait: true
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.1-flash-lite
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:1
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
          flags: >-
            --service-account=municipal-rag-runtime@municipal-rag-portfolio.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
            --command=python
            --args=cloud_bootstrap.py
            --cpu=1
            --memory=1Gi
            --max-retries=0
            --task-timeout=15m
      - name: Deploy a new revision of the existing service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: municipal-rag-portfolio
          region: asia-northeast1
          service: municipal-rag-assistant
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            RAG_BACKEND=qdrant
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_COLLECTION_NAME=municipality_rag_docs_v2_contextual_heading_v1
            LLM_MODEL_NAME=gemini-3.1-flash-lite
            CLASSIFIER_MODEL_NAME=gemini-3.1-flash-lite
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_API_KEY=gemini-api-key:1
            DATABASE_URL=rag-database-url:1
            QDRANT_API_KEY=qdrant-api-key:5
          flags: >-
            --add-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }}
      - name: Check Streamlit health endpoint
        run: curl --fail --retry 5 --retry-delay 10 "${{ steps.deploy.outputs.url }}/_stcore/health"
